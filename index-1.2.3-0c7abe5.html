#status-splash {

	height: auto;
	object-fit: contain;
	margin-top: var(--runes-nudge-y);

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;

#status-bottom {

	background-color: #4CAF50;
	color: white;
	border: none;
	border-radius: 0.5rem;
	cursor: pointer;
	transition: background-color 0.3s, opacity 0.2s ease;
}

#play-button:hover {
	background-color: #45a049;
}

#play-button:active {
	background-color: #3d8b40;
}

#puzzle-info {
	text-align: center;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.75rem;
	color: #666;
	line-height: 1.6;
	width: 100%;
	padding: 0 20px;
	box-sizing: border-box;
	opacity: 0;
	transition: opacity 0.5s ease-in;
}

#version-number {
	position: fixed;
	top: 8px;
	left: 10px;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.65rem;
	color: #999;
	z-index: 1000;
}

/* --- Orientation Lock Styling --- */
#orientation-warning {
	display: none;
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background-color: white;
	color: #5b3943;
	z-index: 9999;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	text-align: center;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
}

#orientation-warning span {
	font-size: 4rem;
	margin-bottom: 1rem;
}

@media (min-width: 900px) {
	#status {
		--brand-gap: clamp(16px, 3.2vh, 36px);
		--brand-offset-y: clamp(12px, 2.5vh, 36px);
		--splash-width: min(64vw, 760px);
		--splash-max-height: 32vh;
		--runes-width: min(32vw, 320px);
		--runes-max-height: 30vh;
		--runes-nudge-y: -10px;

@media (max-height: 760px) {

		--runes-width: min(56vw, 250px);
		--runes-max-height: 22vh;
		--runes-nudge-y: -6px;
	}
}

@media (orientation: portrait) and (max-aspect-ratio: 9/16) {
	#status {
		--brand-gap: clamp(6px, 1.1vh, 12px);

		--runes-width: min(58vw, 260px);
		--runes-max-height: 22vh;
		--runes-nudge-y: -5px;
	}
}

/* Only show the warning if:
   1. The device is in landscape 
   2. AND the screen width is small (typical of a phone) */

	#orientation-warning {
		display: flex;
	}
	#canvas, #status, #version-number {
		display: none !important;
	}
}

// localStorage bridge for game save/load + user stats tracking
(function () {
	const SAVE_KEY = '3seals_save';
	const FIRST_VISIT_KEY = '3seals_has_visited';

	function todayIsoDate() {
		const now = new Date();
		const yyyy = now.getFullYear();
		const mm = String(now.getMonth() + 1).padStart(2, '0');
		const dd = String(now.getDate()).padStart(2, '0');
		return `${yyyy}-${mm}-${dd}`;
	}

	function isIsoDate(value) {
		return /^\d{4}-\d{2}-\d{2}$/.test(value);
	}

	function resolvePuzzleId(stateObj) {
		if (!stateObj || typeof stateObj !== 'object') return null;
		return String(stateObj.metadata_id || stateObj.puzzle_id || '').trim() || null;
	}

	function resolvePuzzleDate(stateObj) {
		const showDate = stateObj && typeof stateObj.show_date === 'string' ? stateObj.show_date.trim() : '';
		return isIsoDate(showDate) ? showDate : todayIsoDate();
	}

	function getWinGuessCount(stateObj) {
		if (
			stateObj &&
			typeof stateObj.winning_guess_count === 'number' &&
			stateObj.winning_guess_count >= 0
		) {
			return stateObj.winning_guess_count;
		}
		if (stateObj && Array.isArray(stateObj.all_guesses)) {
			return stateObj.all_guesses.length;
		}
		return 0;
	}

	function getTotalWordsFound(stateObj) {
		if (!stateObj || !stateObj.found_words) {
			if (stateObj && Array.isArray(stateObj.all_guesses)) {
				return stateObj.all_guesses.length;
			}
			return 0;
		}
		if (typeof stateObj.found_words === 'object') {
			const keyCount = Object.keys(stateObj.found_words).length;
			if (keyCount > 0) return keyCount;
		}
		if (Array.isArray(stateObj.all_guesses)) {
			return stateObj.all_guesses.length;
		}
		return 0;
	}

	function isCompletedState(stateObj) {
		return !!(stateObj && Array.isArray(stateObj.found_seals) && stateObj.found_seals.length >= 3);
	}

	async function ensureGuestSession() {
		await fetch('/.netlify/functions/session', {
			method: 'POST',
			credentials: 'include',
			cache: 'no-store',
			keepalive: true
		});
	}

	async function upsertUserStats(payload) {
		await fetch('/.netlify/functions/stats-event', {
			method: 'POST',
			credentials: 'include',
			cache: 'no-store',
			keepalive: true,
			headers: { 'Content-Type': 'application/json' },
			body: JSON.stringify(payload)
		});
	}

	function markCompletedAndSendIfNeeded(stateObj) {
		if (!isCompletedState(stateObj)) return;
		const puzzleId = resolvePuzzleId(stateObj);
		if (!puzzleId) return;

		const payload = {
			puzzle_id: puzzleId,
			puzzle_date: resolvePuzzleDate(stateObj),
			guesses_on_win: getWinGuessCount(stateObj),
			total_words_found: getTotalWordsFound(stateObj)
		};

		ensureGuestSession()
			.then(() => upsertUserStats(payload))
			.catch((err) => {
				console.warn('user stats tracking failed:', err);
			});
	}

	window.savePuzzleState = function (stateObj) {
		try {
			localStorage.setItem(SAVE_KEY, JSON.stringify(stateObj));
			markCompletedAndSendIfNeeded(stateObj);
			return true;
		} catch (e) {
			console.error('Failed to save game state:', e);
			return false;
		}
	};

	window.loadPuzzleState = function () {
		try {
			return localStorage.getItem(SAVE_KEY);
		} catch (e) {
			console.error('Failed to load game state:', e);
			return null;
		}
	};

	window.clearPuzzleState = function () {
		try {
			localStorage.removeItem(SAVE_KEY);
			return true;
		} catch (e) {
			console.error('Failed to clear game state:', e);
			return false;
		}
	};

	window.consumeFirstVisitFlag = function () {
		try {
			if (localStorage.getItem(FIRST_VISIT_KEY) !== null) {
				return false;
			}
			localStorage.setItem(FIRST_VISIT_KEY, '1');
			return true;
		} catch (e) {
			console.warn('Failed to read/write first-visit flag:', e);
			return false;
		}
	};

	window.shareRunesResult = function (sharePayload) {
		try {
			if (!navigator.share) {
				return 'unsupported';
			}

			const payload = (sharePayload && typeof sharePayload === 'object') ? sharePayload : {};
			const shareData = {};
			if (typeof payload.title === 'string' && payload.title.trim()) shareData.title = payload.title;
			if (typeof payload.text === 'string' && payload.text.trim()) shareData.text = payload.text;
			if (typeof payload.url === 'string' && payload.url.trim()) shareData.url = payload.url;

			navigator.share(shareData).catch((err) => {
				if (err && err.name !== 'AbortError') {
					console.warn('Web Share API failed:', err);
				}
			});

			return 'opened';
		} catch (e) {
			console.warn('Web Share API unavailable:', e);
			return 'error';
		}
	};

	ensureGuestSession().catch((err) => {
		console.warn('guest session init failed:', err);
	});
})();

		while (statusNotice.lastChild) {

		const lines = text.split('\n');

			statusNotice.appendChild(document.createTextNode(line));

				console.error('Error while registering service worker:', err);

		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
