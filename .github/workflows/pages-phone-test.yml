name: Deploy phone-test to GitHub Pages

on:
  push:
    branches:
      - phone-test
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare site artifact
        run: |
          rm -rf _site
          mkdir -p _site
          rsync -av --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='.netlify/' \
            ./ _site/

      - name: Ensure root index.html for Pages
        run: |
          latest_html="$(ls -1 _site/index-*.html | sort | tail -n 1)"
          if [ -z "$latest_html" ]; then
            echo "No versioned index-*.html found in artifact" >&2
            exit 1
          fi
          cp "$latest_html" _site/index.html

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
