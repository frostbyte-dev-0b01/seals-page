# Netlify configuration for 3-Seals game deployment

[functions]
  directory = "netlify/functions"

[dev]
  publish = "."
  functions = "netlify/functions"

[[edge_functions]]
  function = "serve-pck"
  path = "/index-*.pck"
  cache = "manual"

# Redirect root to the current versioned HTML
[[redirects]]
  from = "/"
  to = "/index-1.2.2-f404c4e.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/index-1.2.2-f404c4e.html"
  status = 301

[[headers]]
  # Never cache index.html - always fetch fresh
  for = "/index-*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  # Never cache root path either
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  # Versioned game assets are content-addressed by filename; cache aggressively.
  for = "/index-*.wasm"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index-*.pck"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index-*.pck.br"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index-*.pck.gz"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index-*.js"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index-*.json"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index-*.png"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"
