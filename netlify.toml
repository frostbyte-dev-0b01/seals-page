# Netlify configuration for 3-Seals game deployment

# Redirect root to the current versioned HTML
[[redirects]]
  from = "/"
  to = "/index-0.0.12-3fc5d94.html"
  status = 200

[[redirects]]
  from = "/index.html"
  to = "/index-0.0.12-3fc5d94.html"
  status = 301

[[headers]]
  # Never cache index.html - always fetch fresh
  for = "/index-*.html"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"

[[headers]]
  # Never cache root path either
  for = "/"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"
    Pragma = "no-cache"
    Expires = "0"
