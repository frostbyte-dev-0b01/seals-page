html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #333;
	background-color: white;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status {
	background:
		radial-gradient(circle at 50% 18%, rgba(245, 168, 91, 0.14), transparent 32%),
		radial-gradient(circle at 18% 82%, rgba(183, 139, 222, 0.10), transparent 28%),
		linear-gradient(180deg, #fff9f3 0%, #ffffff 44%, #fffaf5 100%);
	position: absolute;
	inset: 0;
	overflow: hidden;
	display: grid;
	grid-template-rows: minmax(0, 1fr) auto;
	gap: clamp(14px, 3vh, 32px);
	padding:
		max(18px, env(safe-area-inset-top))
		0
		max(20px, env(safe-area-inset-bottom));
	box-sizing: border-box;
	min-height: 100dvh;
	--brand-gap: clamp(12px, 2.2vh, 28px);
	--brand-offset-y: clamp(18px, 5vh, 56px);
	--splash-width: min(90vw, 620px);
	--splash-max-height: 26vh;
	--runes-width: min(52vw, 280px);
	--runes-max-height: 28vh;
	--runes-nudge-y: -8px;
	--status-controls-reserved: clamp(160px, 24vh, 230px);
	--status-action-height: clamp(56px, 7.5vh, 72px);
	transition: opacity 0.42s ease, filter 0.42s ease, transform 0.42s ease;
}

#status::before {
	content: "";
	position: absolute;
	inset: 0;
	background:
		linear-gradient(120deg, rgba(255, 255, 255, 0.72), rgba(255, 255, 255, 0)),
		radial-gradient(circle at 50% 50%, rgba(255, 255, 255, 0.32), transparent 52%);
	pointer-events: none;
	opacity: 0.9;
}

#status-brand {
	position: relative;
	grid-row: 1;
	align-self: center;
	justify-self: center;
	width: 100%;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: var(--brand-gap);
	transform: translateY(var(--brand-offset-y));
	pointer-events: none;
	z-index: 1;
	transition: transform 0.5s cubic-bezier(0.2, 0.9, 0.2, 1), opacity 0.35s ease;
}

#status-splash {
	width: var(--splash-width);
	max-height: var(--splash-max-height);
	height: auto;
	margin: 0;
	opacity: 0;
	animation: splash-cascade-fade-in 1.0s ease 0.05s forwards;
}

#status-splash.show-image--false {
	display: none;
}

#status-runes {
	width: var(--runes-width);
	max-height: var(--runes-max-height);
	height: auto;
	margin-top: var(--runes-nudge-y);
	opacity: 0;
	animation: splash-cascade-fade-in 1.0s ease 0.05s forwards;
}

@keyframes splash-cascade-fade-in {
	from { opacity: 0; }
	to { opacity: 1; }
}

#status-notice {
	display: none;
}

#status-controls {
	grid-row: 2;
	width: 100%;
	min-height: var(--status-controls-reserved);
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: flex-end;
	padding: 0 20px 0.25rem;
	box-sizing: border-box;
	gap: 0.55rem;
	z-index: 3;
	transition: transform 0.42s cubic-bezier(0.2, 0.9, 0.2, 1), opacity 0.3s ease;
}

#status-action {
	display: grid;
	place-items: center;
	min-height: var(--status-action-height);
	width: 100%;
}

#status-action > * {
	grid-area: 1 / 1;
}

#status-progress {
	position: relative;
	width: 56px;
	height: 56px;
	z-index: 2;
	transition: opacity 0.5s ease;
}

#status-progress-text {
	position: relative;
	margin: 0 auto;
	color: #5b3943;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.75rem;
	font-weight: 500;
	letter-spacing: 0.01em;
	text-align: center;
	z-index: 2;
	transition: opacity 0.5s ease;
}

.status-progress-ring {
	width: 100%;
	height: 100%;
	transform: rotate(-90deg);
	transform-origin: 50% 50%;
	will-change: transform;
}

.status-progress-ring-track {
	fill: none;
	stroke: rgba(183, 139, 222, 0.18);
	stroke-width: 4;
}

.status-progress-ring-fill {
	fill: none;
	stroke: #f5a85b;
	stroke-width: 4;
	stroke-linecap: round;
	stroke-dasharray: 100;
	stroke-dashoffset: 100;
	transition: stroke-dashoffset 0.2s linear;
}

#status-progress.indeterminate {
	animation: ring-pulse 1.20s ease-in-out infinite;
	will-change: opacity;
}

#status-progress.indeterminate .status-progress-ring {
	animation: ring-rotate 0.95s linear infinite;
}

#status-progress.indeterminate .status-progress-ring-fill {
	stroke-dasharray: 28 72;
	stroke-dashoffset: 0;
	transition: none;
}

@keyframes ring-pulse {
	0%, 100% { opacity: 1; }
	50% { opacity: 0.4; }
}

@keyframes ring-rotate {
	from { transform: rotate(-90deg); }
	to { transform: rotate(270deg); }
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 auto;
	max-width: min(86vw, 420px);
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#whats-new {
	position: fixed;
	top: 28px;
	left: 10px;
	width: auto;
	max-width: min(78vw, 320px);
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	color: #5b3943;
	opacity: 0;
	transform: translateY(4px);
	transition: opacity 0.5s ease, transform 0.5s ease;
	z-index: 1000;
}

#whats-new.is-visible {
	animation: whats-new-cascade 0.5s ease var(--whats-new-delay, 0ms) forwards;
}

@keyframes whats-new-cascade {
	from {
		opacity: 0;
		transform: translateY(4px);
	}
	to {
		opacity: 1;
		transform: translateY(0);
	}
}

#whats-new[hidden] {
	display: none;
}

#whats-new-toggle {
	width: auto;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 0.45rem;
	padding: 0.28rem 0.5rem 0.32rem;
	background: rgba(255, 255, 255, 0.82);
	border: 1px solid rgba(245, 168, 91, 0.18);
	border-radius: 0.55rem;
	box-shadow: 0 1px 2px rgba(91, 57, 67, 0.06);
	color: inherit;
	font: inherit;
	cursor: pointer;
	text-align: left;
}

#whats-new-toggle:hover {
	background: rgba(255, 255, 255, 0.94);
}

#whats-new-toggle:focus-visible {
	outline: 2px solid rgba(245, 168, 91, 0.65);
	outline-offset: 2px;
}

#whats-new-summary {
	display: flex;
	align-items: center;
	gap: 0.55rem;
	min-width: 0;
}

#whats-new[data-expanded="true"] {
	width: min(78vw, 320px);
}

#whats-new[data-expanded="true"] #whats-new-toggle {
	width: 100%;
}

#whats-new-dot {
	width: 0.5rem;
	height: 0.5rem;
	flex: 0 0 auto;
	border-radius: 999px;
	background: #f5a85b;
	box-shadow: 0 0 0 3px rgba(245, 168, 91, 0.16);
}

#whats-new-dot[hidden] {
	display: none;
}

#whats-new-title {
	font-size: 0.76rem;
	font-weight: 500;
	letter-spacing: 0.01em;
}

#whats-new-chevron {
	font-size: 0.72rem;
	color: #8e6671;
	transition: transform 0.2s ease;
}

#whats-new[data-expanded="true"] #whats-new-chevron {
	transform: rotate(180deg);
}

#whats-new-panel {
	margin-top: 0.45rem;
	padding: 0.75rem 0.8rem 0.8rem;
	background: rgba(255, 255, 255, 0.96);
	border: 1px solid rgba(245, 168, 91, 0.2);
	border-radius: 0.6rem;
	box-shadow: 0 6px 20px rgba(91, 57, 67, 0.08);
	font-size: 0.8rem;
	line-height: 1.5;
	color: #6a5058;
}

#whats-new-panel[hidden] {
	display: none;
}

#whats-new-version {
	margin: 0 0 0.45rem;
	font-size: 0.7rem;
	font-weight: 700;
	letter-spacing: 0.04em;
	text-transform: uppercase;
	color: #9a6f3d;
}

#whats-new-list {
	margin: 0;
	padding-left: 1.1rem;
}

#whats-new-list li + li {
	margin-top: 0.3rem;
}

#play-button {
	display: block;
	visibility: hidden;
	opacity: 0;
	pointer-events: none;
	padding: clamp(0.75rem, 1.8vh, 1.1rem) 1.65rem;
	font-size: 1.5rem;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-weight: 700;
	letter-spacing: 0.01em;
	background: linear-gradient(180deg, #55c95d 0%, #43ad4b 100%);
	color: white;
	border: none;
	border-radius: 999px;
	box-shadow: 0 12px 28px rgba(67, 173, 75, 0.24);
	cursor: pointer;
	transform: translateY(8px) scale(0.98);
	transition:
		background 0.28s ease,
		box-shadow 0.28s ease,
		opacity 0.5s ease,
		transform 0.5s cubic-bezier(0.2, 0.9, 0.2, 1);
}

#play-button:hover {
	background: linear-gradient(180deg, #5fd468 0%, #46b94f 100%);
	box-shadow: 0 16px 36px rgba(67, 173, 75, 0.28);
}

#play-button:active {
	background: linear-gradient(180deg, #48b651 0%, #3b9842 100%);
	box-shadow: 0 8px 18px rgba(67, 173, 75, 0.2);
}

#play-button:focus-visible {
	outline: 3px solid rgba(245, 168, 91, 0.42);
	outline-offset: 3px;
}

#first-play-modal[hidden] {
	display: none;
}

#first-play-modal {
	position: fixed;
	inset: 0;
	z-index: 1200;
	display: flex;
	align-items: center;
	justify-content: center;
	padding: 1rem;
	box-sizing: border-box;
	background: rgba(43, 36, 30, 0.22);
	backdrop-filter: blur(4px);
	opacity: 0;
	pointer-events: none;
	transition: opacity 0.18s ease;
}

#first-play-modal.is-open {
	opacity: 1;
	pointer-events: auto;
}

#first-play-modal.is-closing {
	opacity: 0;
	pointer-events: none;
}

#first-play-card {
	width: min(88vw, 460px);
	padding: 1.65rem 1.5rem 1.4rem;
	box-sizing: border-box;
	text-align: center;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	background: rgba(255, 251, 244, 0.98);
	border: 1px solid rgba(115, 89, 64, 0.18);
	border-radius: 18px;
	box-shadow:
		0 20px 48px rgba(43, 36, 30, 0.18),
		0 1px 0 rgba(255, 255, 255, 0.55) inset;
	color: #2b241e;
	opacity: 0;
	transform: scale(0.94) translateY(4px);
	transform-origin: center;
	transition:
		transform 0.3s cubic-bezier(0.18, 0.9, 0.24, 1.12),
		opacity 0.2s ease;
}

#first-play-modal.is-open #first-play-card {
	opacity: 1;
	transform: scale(1) translateY(0);
}

#first-play-modal.is-closing #first-play-card {
	opacity: 0;
	transform: scale(0.94) translateY(4px);
	transition:
		transform 0.2s cubic-bezier(0.34, 0.02, 0.56, 1),
		opacity 0.15s ease;
}

#first-play-card h2 {
	margin: 0 0 0.45rem;
	font-size: clamp(1.6rem, 4vw, 2.15rem);
	line-height: 1.1;
	letter-spacing: -0.02em;
}

#first-play-card p {
	margin: 0 0 1.15rem;
	font-size: clamp(1rem, 2.9vw, 1.18rem);
	line-height: 1.45;
	color: #5d5146;
}

#first-play-actions {
	display: grid;
	gap: 0.75rem;
}

.first-play-choice {
	display: block;
	width: 100%;
	min-height: 62px;
	padding: 0.8rem 1rem;
	box-sizing: border-box;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: clamp(1rem, 2.8vw, 1.12rem);
	font-weight: 700;
	letter-spacing: 0.01em;
	border: 1px solid rgba(255, 255, 255, 0.48);
	border-radius: 14px;
	cursor: pointer;
	transition: transform 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
}

.first-play-choice:hover {
	transform: translateY(-1px);
}

.first-play-choice:active {
	transform: translateY(1px);
}

.first-play-choice.primary {
	background: linear-gradient(180deg, #54b861 0%, #4aa356 100%);
	color: #fff;
	box-shadow: 0 10px 22px rgba(80, 168, 92, 0.18);
}

.first-play-choice.primary:hover {
	background: linear-gradient(180deg, #5dc76b 0%, #4fb15b 100%);
	box-shadow: 0 12px 24px rgba(80, 168, 92, 0.22);
}

.first-play-choice.secondary {
	background: linear-gradient(180deg, #f7af68 0%, #f09d4f 100%);
	color: #fff;
	box-shadow: 0 10px 22px rgba(246, 168, 90, 0.18);
}

.first-play-choice.secondary:hover {
	background: linear-gradient(180deg, #ffb873 0%, #f3a457 100%);
	box-shadow: 0 12px 24px rgba(246, 168, 90, 0.22);
}

.first-play-choice:focus-visible {
	outline: 3px solid rgba(245, 168, 91, 0.45);
	outline-offset: 3px;
}

#puzzle-info {
	text-align: center;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.75rem;
	color: #666;
	line-height: 1.6;
	width: 100%;
	margin-top: 0.35rem;
	box-sizing: border-box;
	opacity: 0;
	transform: translateY(8px);
	animation: puzzle-info-cascade 1.1s ease 700ms forwards;
}

@keyframes puzzle-info-cascade {
	from {
		opacity: 0;
		transform: translateY(8px);
	}
	to {
		opacity: 1;
		transform: translateY(0);
	}
}

#puzzle-info-number,
#puzzle-info-editor {
	min-height: 1.6em;
}

#version-number {
	position: fixed;
	top: 8px;
	left: 10px;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.65rem;
	color: #999;
	z-index: 1000;
	transition: opacity 0.28s ease, transform 0.28s ease;
}

#status.is-ready #play-button {
	transform: translateY(0) scale(1);
}

#status.is-ready #play-button:hover {
	transform: translateY(-2px) scale(1.01);
}

#status.is-ready #play-button:active {
	transform: translateY(1px) scale(0.985);
}

#status.is-launching {
	opacity: 0;
	filter: blur(6px);
	transform: scale(1.012);
}

#status.is-launching #status-brand {
	transform: translateY(calc(var(--brand-offset-y) - 10px)) scale(0.985);
	opacity: 0;
}

#status.is-launching #status-controls {
	opacity: 0;
	transform: translateY(12px);
}

body.is-launching-game #whats-new,
body.is-launching-game #version-number {
	opacity: 0;
	transform: translateY(-6px);
}

@media (max-width: 520px) {
	#whats-new {
		max-width: min(84vw, 280px);
	}

	#whats-new[data-expanded="true"] {
		width: min(84vw, 280px);
	}

	#first-play-card {
		width: min(92vw, 400px);
		padding: 1.4rem 1.1rem 1.15rem;
		border-radius: 16px;
	}

	#first-play-card p {
		margin-bottom: 1rem;
	}

	.first-play-choice {
		min-height: 58px;
	}
}

/* --- Orientation Lock Styling --- */
#orientation-warning {
	display: none;
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background-color: white;
	color: #5b3943;
	z-index: 9999;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	text-align: center;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
}

#orientation-warning span {
	font-size: 4rem;
	margin-bottom: 1rem;
}

@media (min-width: 900px) {
	#status {
		--brand-gap: clamp(16px, 3.2vh, 36px);
		--brand-offset-y: clamp(24px, 5vh, 64px);
		--splash-width: min(64vw, 760px);
		--splash-max-height: 32vh;
		--runes-width: min(32vw, 320px);
		--runes-max-height: 30vh;
		--runes-nudge-y: -10px;
		--status-controls-reserved: clamp(170px, 22vh, 230px);
		--status-action-height: clamp(60px, 7vh, 72px);
	}
}

@media (max-height: 760px) {
	#status {
		--brand-gap: clamp(8px, 1.6vh, 16px);
		--brand-offset-y: clamp(16px, 4vh, 40px);
		--splash-width: min(88vw, 520px);
		--splash-max-height: 22vh;
		--runes-width: min(56vw, 250px);
		--runes-max-height: 22vh;
		--runes-nudge-y: -6px;
		--status-controls-reserved: clamp(150px, 22vh, 200px);
		--status-action-height: clamp(54px, 7vh, 64px);
	}
}

@media (orientation: portrait) and (max-aspect-ratio: 9/16) {
	#status {
		--brand-gap: clamp(6px, 1.1vh, 12px);
		--brand-offset-y: clamp(20px, 5vh, 48px);
		--splash-width: min(94vw, 560px);
		--splash-max-height: 22vh;
		--runes-width: min(58vw, 260px);
		--runes-max-height: 22vh;
		--runes-nudge-y: -5px;
		--status-controls-reserved: clamp(146px, 22vh, 196px);
		--status-action-height: clamp(54px, 7vh, 64px);
	}
}

/* Only show the warning if:
   1. The device is in landscape 
   2. AND the screen width is small (typical of a phone) */
@media (orientation: landscape) and (max-width: 950px) {
	#orientation-warning {
		display: flex;
	}
	#canvas, #status, #version-number {
		display: none !important;
	}
}

	const now = new Date();
	const yyyy = now.getFullYear();
	const mm = String(now.getMonth() + 1).padStart(2, '0');

		} catch (e) {

			return false;
		}
	};

	window.clearTutorialState = function () {

			return true;
		} catch (e) {
			console.error('Failed to clear tutorial state:', e);
			return false;

	};

		try {
			if (localStorage.getItem(FIRST_VISIT_KEY) !== null) {

			return true;

			console.warn('Failed to read/write first-visit flag:', e);
			return false;
		}
	};

	window.queueTutorialLaunch = function () {
		try {
			localStorage.setItem(TUTORIAL_LAUNCH_KEY, '1');

			console.warn('Failed to queue tutorial launch:', e);

			return true;
		} catch (e) {
			console.warn('Failed to consume tutorial launch flag:', e);
			return false;
		}
	};

		if (!whatsNew || !whatsNewToggle || !whatsNewPanel) return;
		whatsNew.dataset.expanded = expanded ? 'true' : 'false';
		whatsNewToggle.setAttribute('aria-expanded', expanded ? 'true' : 'false');
		whatsNewPanel.hidden = !expanded;
		if (expanded) {
			markWhatsNewSeen();
		}
	}

	function dismissWhatsNew(immediate = true) {
		if (!whatsNew) return;
		markWhatsNewSeen();
		setWhatsNewExpanded(false);
		whatsNew.classList.remove('is-visible');
		if (immediate) {
			whatsNew.hidden = true;
			return;
		}
		window.setTimeout(() => {
			whatsNew.hidden = true;
		}, 220);
	}

	async function loadWhatsNewData() {
		try {
			const response = await fetch(WHATS_NEW_URL, {
				cache: 'no-store',
				credentials: 'same-origin',
			});
			if (!response.ok) {
				return null;
			}
			const payload = await response.json();
			if (!payload || typeof payload !== 'object' || !Array.isArray(payload.items)) {
				return null;
			}
			return payload;
		} catch (_err) {
			return null;
		}
	}

	function renderWhatsNew() {
		if (!whatsNew || !whatsNewToggle || !whatsNewPanel || !whatsNewList || !whatsNewVersion) {
			return;
		}

		const items = whatsNewData && Array.isArray(whatsNewData.items) ? whatsNewData.items : [];
		const notesVersion = whatsNewData && typeof whatsNewData.version === 'string'
			? whatsNewData.version.trim()
			: '';
		const notesTitle = whatsNewData && typeof whatsNewData.title === 'string'
			? whatsNewData.title.trim()
			: '';

		if (items.length === 0) {
			whatsNew.hidden = true;
			return;
		}

		whatsNewList.replaceChildren();
		items.forEach((entry) => {
			const item = document.createElement('li');
			item.textContent = entry;
			whatsNewList.appendChild(item);
		});

		if (notesTitle) {
			const titleNode = document.getElementById('whats-new-title');
			if (titleNode) {
				titleNode.textContent = notesTitle;
			}
		}

		whatsNewVersion.textContent = `Version ${notesVersion || currentVersion}`;
		whatsNew.hidden = false;
		whatsNew.dataset.expanded = 'false';
		whatsNewPanel.hidden = true;
		whatsNewToggle.setAttribute('aria-expanded', 'false');

		const seenVersion = safeLocalStorageGet(WHATS_NEW_STORAGE_KEY);
		const isUnseenVersion = seenVersion !== currentVersion;
		if (whatsNewDot) {
			whatsNewDot.hidden = !isUnseenVersion;
		}
		whatsNewRendered = true;
		maybeRevealWhatsNew();
	}

	function getRemainingSplashDelayMs(targetMs) {
		const startMs = typeof window._splashCascadeStartMs === 'number'
			? window._splashCascadeStartMs
			: performance.now();
		return Math.max(0, targetMs - (performance.now() - startMs));
	}

	function maybeRevealWhatsNew() {
		if (!whatsNewRendered || whatsNewRevealStarted) return;
		if (!whatsNew || whatsNew.hidden || whatsNew.classList.contains('is-visible')) return;
		whatsNewRevealStarted = true;
		whatsNew.style.setProperty('--whats-new-delay', `${getRemainingSplashDelayMs(WHATS_NEW_REVEAL_AT_MS)}ms`);
		requestAnimationFrame(() => {
			whatsNew.classList.add('is-visible');
		});
	}

	function focusGameCanvas() {
		if (!canvas) return;
		if (!canvas.hasAttribute('tabindex')) {
			canvas.tabIndex = 0;
		}
		canvas.focus({ preventScroll: true });
	}

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			if (versionTag) versionTag.remove(); // Clean up version tag when game starts
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		if (statusProgressText) {
			statusProgressText.style.display = mode === 'progress' ? 'block' : 'none';
		}
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function startGame() {
		if (launchStarted || !statusOverlay) return;
		launchStarted = true;
		hideFirstPlayModal();
		dismissWhatsNew(false);
		document.body.classList.add('is-launching-game');
		statusOverlay.classList.add('is-launching');
		playButton.disabled = true;
		playButton.style.pointerEvents = 'none';
		window.setTimeout(() => {
			statusOverlay.remove();
			if (versionTag) versionTag.remove();
			initializing = false;
			requestAnimationFrame(() => {
				requestAnimationFrame(focusGameCanvas);
			});
		}, LAUNCH_TRANSITION_MS);
	}

	function shouldOfferFirstPlayChoice() {
		try {
			return !!(window.consumeFirstVisitFlag && window.consumeFirstVisitFlag());
		} catch (err) {
			console.warn('first-play prompt check failed:', err);
			return false;
		}
	}

	function showFirstPlayModal() {
		if (!firstPlayModal) return;
		window.clearTimeout(firstPlayShowTimer);
		window.clearTimeout(firstPlayHideTimer);
		firstPlayModal.classList.remove('is-open');
		firstPlayModal.classList.remove('is-closing');
		firstPlayModal.hidden = false;
		firstPlayShowTimer = window.setTimeout(() => {
			if (!firstPlayModal || firstPlayModal.hidden) return;
			firstPlayModal.classList.add('is-open');
		}, FIRST_PLAY_MODAL_OPEN_DELAY_MS);
		playButton.disabled = true;
		playButton.style.pointerEvents = 'none';
		window.setTimeout(() => {
			if (firstPlayTutorial) firstPlayTutorial.focus();
		}, 0);
	}

	function hideFirstPlayModal() {
		if (firstPlayModal && !firstPlayModal.hidden) {
			window.clearTimeout(firstPlayShowTimer);
			window.clearTimeout(firstPlayHideTimer);
			firstPlayModal.classList.remove('is-open');
			firstPlayModal.classList.add('is-closing');
			firstPlayHideTimer = window.setTimeout(() => {
				firstPlayModal.hidden = true;
				firstPlayModal.classList.remove('is-closing');
			}, FIRST_PLAY_MODAL_CLOSE_MS);
		}
		if (!launchStarted) {
			playButton.disabled = false;
			playButton.style.pointerEvents = 'auto';
		}
	}

	function launchDailyPuzzle() {
		window.sendActivityEvent('first_play');
		startGame();
	}

	function launchTutorialPuzzle() {
		window.sendActivityEvent('first_play');
		if (window.clearTutorialState) window.clearTutorialState();
		if (window.queueTutorialLaunch) window.queueTutorialLaunch();
		if (window.requestTutorialLaunch) window.requestTutorialLaunch();
		startGame();
	}

	playButton.addEventListener('click', function () {
		if (shouldOfferFirstPlayChoice()) {
			showFirstPlayModal();
			return;
		}
		launchDailyPuzzle();
	});

	if (firstPlayTutorial) {
		firstPlayTutorial.addEventListener('click', launchTutorialPuzzle);
	}

	if (firstPlayPuzzle) {
		firstPlayPuzzle.addEventListener('click', launchDailyPuzzle);
	}

	document.addEventListener('keydown', function (event) {
		if (!firstPlayModal || firstPlayModal.hidden) return;
		if (event.key === 'Escape') {
			event.preventDefault();
			launchDailyPuzzle();
		}
	});

	if (whatsNewToggle) {
		whatsNewToggle.addEventListener('click', function () {
			const expanded = whatsNewToggle.getAttribute('aria-expanded') === 'true';
			setWhatsNewExpanded(!expanded);
		});
	}

	window.addEventListener('focus', () => {
		if (!gameReady || initializing) return;
		requestAnimationFrame(focusGameCanvas);
	});

	document.addEventListener('visibilitychange', () => {
		if (document.hidden || !gameReady || initializing) return;
		requestAnimationFrame(focusGameCanvas);
	});

	function displayPuzzleInfo(metadata) {
		if (!metadata) return;
		if (metadata.show_date && puzzleInfoDate) {
			puzzleInfoDate.textContent = metadata.show_date;
		}
		if (puzzleInfoNumber && metadata.id) {
			let numberText = 'No. ' + metadata.id;
			if (metadata.submitted_by) numberText += ' - Submitted by ' + metadata.submitted_by;
			puzzleInfoNumber.textContent = numberText;
		}
		if (puzzleInfoEditor && metadata.editor) {
			puzzleInfoEditor.textContent = 'Edited by ' + metadata.editor;
		}
	}

	function showSpinner() {
		if (spinnerShown || playButtonShown || !initializing) return;
		spinnerShown = true;
		if (statusProgress) {
			statusProgress.style.display = 'block';
			statusProgress.style.opacity = '1';
			statusProgress.style.pointerEvents = 'auto';
		}
		if (statusProgressText) {
			statusProgressText.style.display = 'block';
			statusProgressText.style.opacity = '1';
		}
		if (statusProgress) {
			statusProgress.classList.add('indeterminate');
		}
	}

	function hideSpinner() {
		if (!spinnerShown) return;
		spinnerShown = false;
		if (statusProgress) {
			statusProgress.classList.remove('indeterminate');
			statusProgress.style.opacity = '0';
			statusProgress.style.pointerEvents = 'none';
		}
		if (statusProgressText) {
			statusProgressText.style.opacity = '0';
		}
	}

	function showPlayButton() {
		if (playButtonShown || !initializing) return;
		playButtonShown = true;
		hideSpinner();
		if (statusProgress) {
			statusProgress.classList.remove('indeterminate');
			statusProgress.style.pointerEvents = 'none';
		}
		statusOverlay.classList.add('is-ready');
		playButton.style.visibility = 'visible';
		playButton.style.opacity = '1';
		playButton.style.pointerEvents = 'auto';
	}

	async function loadTodaysPuzzleFromManifest() {
		try {
			const response = await fetch(PUZZLES_MANIFEST_URL, { credentials: 'same-origin' });
			if (!response.ok) {
				return;
			}
			const manifest = await response.json();
			if (!manifest || typeof manifest !== 'object') {
				return;
			}
			const today = todayIsoDate();
			const fileKey = manifest.by_date && manifest.by_date[today];
			if (fileKey) {
				const entry = manifest.by_file && manifest.by_file[fileKey];
				if (entry) {
					displayPuzzleInfo({
						id: entry.id,
						show_date: entry.show_date,
						editor: entry.editor,
						submitted_by: entry.submitted_by,
					});
					return;
				}
			}
		} catch (_err) {
			// Fallthrough — show date + email without number/editor.
		}
	}

	loadTodaysPuzzleFromManifest();
	showSpinner();

	window.updatePuzzleInfo = function (metadata) {
		displayPuzzleInfo(metadata);
		if (metadata) {
			window._puzzleMetadata = metadata;
			window.sendActivityEvent('first_seen');
		}
	};

	(function setupDayChangeRefresh() {
		const lastDateKey = '3seals_last_date';
		let lastKnownDate = localStorage.getItem(lastDateKey) || todayIsoDate();
		document.addEventListener('visibilitychange', () => {
			if (!document.hidden) {
				const today = todayIsoDate();
				if (lastKnownDate !== today) {
					window.location.reload();
				}
			} else {
				lastKnownDate = todayIsoDate();
				localStorage.setItem(lastDateKey, lastKnownDate);
			}
		});
		function scheduleMidnightRefresh() {
			const now = new Date();
			const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
			const msUntilMidnight = tomorrow - now;
			setTimeout(() => {
				const today = todayIsoDate();
				if (lastKnownDate !== today) {
					window.location.reload();
				} else {
					scheduleMidnightRefresh();
				}
			}, msUntilMidnight);
		}
		scheduleMidnightRefresh();
	})();

	function scheduleServiceWorkerUpdateCheck() {
		if (!('serviceWorker' in navigator)) {
			return;
		}
		const runCheck = () => {
			navigator.serviceWorker.getRegistration().then((registration) => {
				if (registration) {
					registration.update().catch((err) => {
						console.log('Service worker update check failed:', err);
					});
				}
			});
		};
		if ('requestIdleCallback' in window) {
			window.requestIdleCallback(runCheck, { timeout: 5000 });
			return;
		}
		window.setTimeout(runCheck, 3000);
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) return Promise.reject(new Error('Service worker already exists.'));
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => setTimeout(() => resolve(), 2000)),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusProgressText('Loading assets...');
		installProgressHooks();
		// Kick off whats-new fetch in parallel with the engine load so the
		// data is likely ready by the time the cascade reaches it (~1.55s).
		loadWhatsNewData().then((data) => {
			whatsNewData = data;
			renderWhatsNew();
		});
		// Defer session init until after engine starts downloading .wasm/.pck
		// so the large asset fetches get network priority on first visit.
		const gameStarted = engine.startGame({
			'onProgress': function (current, total) {
				if (!statusProgress) return;
				if (trackedAssetRequestsStarted || preparePhaseStarted) {
					return;
				}
				if (current > 0 && total > 0) {
					if (current >= total) {
						setPreparingPhase();
					} else {
						setStatusProgressText('Loading assets...');
					}
				}
			},
		});
		window.ensureGuestSession().catch((err) => {
			console.warn('guest session init failed:', err);
		});
		gameStarted.then(async () => {
			restoreProgressHooks();
			gameReady = true;
			showPlayButton();
			scheduleServiceWorkerUpdateCheck();
		}, (err) => {
			restoreProgressHooks();
			displayFailureNotice(err);
		});
	}

}());
		</script>
	</body>
</html>
