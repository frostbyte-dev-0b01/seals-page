html, body, #canvas {
	margin: 0;

	color: #333;

#status {
	background-color: white;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#status-bottom {
	position: absolute;
	bottom: 0;
	left: 0;
	right: 0;
	display: flex;
	flex-direction: column;
	align-items: center;
	padding-bottom: max(20px, env(safe-area-inset-bottom));
	gap: 1rem;
}

#play-button {
	display: none;
	padding: 1rem 2rem;
	font-size: 1.5rem;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	background-color: #4CAF50;
	color: white;
	border: none;
	border-radius: 0.5rem;
	cursor: pointer;
	transition: background-color 0.3s;
}

#play-button:hover {
	background-color: #45a049;
}

#play-button:active {
	background-color: #3d8b40;
}

#puzzle-info {
	text-align: center;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.75rem;
	color: #666;
	line-height: 1.6;
	width: 100%;
	padding: 0 20px;
	box-sizing: border-box;
	opacity: 0;
	transition: opacity 0.5s ease-in;
}

#version-number {
	position: fixed;
	top: 8px;
	left: 10px;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.65rem;
	color: #999;
	z-index: 1000;
}

/* --- Orientation Lock Styling --- */
#orientation-warning {
	display: none;
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background-color: white;
	color: #5b3943;
	z-index: 9999;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	text-align: center;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
}

#orientation-warning span {
	font-size: 4rem;
	margin-bottom: 1rem;
}

/* Only show the warning if:
   1. The device is in landscape 
   2. AND the screen width is small (typical of a phone) */
@media (orientation: landscape) and (max-width: 950px) {
	#orientation-warning {
		display: flex;
	}
	#canvas, #status, #version-number {
		display: none !important;
	}
}

// localStorage bridge for game save/load
window.savePuzzleState = function(stateObj) {
	try {
		localStorage.setItem('3seals_save', JSON.stringify(stateObj));
		return true;
	} catch (e) {
		console.error('Failed to save game state:', e);
		return false;
	}
};

window.loadPuzzleState = function() {
	try {
		return localStorage.getItem('3seals_save');
	} catch (e) {
		console.error('Failed to load game state:', e);
		return null;
	}
};

window.clearPuzzleState = function() {
	try {
		localStorage.removeItem('3seals_save');
		return true;
	} catch (e) {
		console.error('Failed to clear game state:', e);
		return false;
	}
};
		</script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index-0.0.12-3fc5d94","experimentalVK":false,"fileSizes":{"index-0.0.12-3fc5d94.pck":38130016,"index-0.0.12-3fc5d94.wasm":52126319},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":"index-0.0.12-3fc5d94.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const playButton = document.getElementById('play-button');
	const versionTag = document.getElementById('version-number');

	let initializing = true;
	let statusMode = '';
	let gameReady = false;

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			if (versionTag) versionTag.remove(); // Clean up version tag when game starts
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function startGame() {
		statusOverlay.remove();
		if (versionTag) versionTag.remove(); // Force remove version tag on Play click
		initializing = false;
	}

	playButton.addEventListener('click', startGame);

	function displayPuzzleInfo(metadata) {
		const puzzleInfo = document.getElementById('puzzle-info');
		if (!puzzleInfo) return;
		let infoText = 'Email: dailyrunesgame@gmail.com';
		if (metadata) {
			let puzzleText = '';
			if (metadata.show_date) puzzleText += metadata.show_date + '<br>';
			if (metadata.id) puzzleText += 'No. ' + metadata.id + '<br>';
			if (metadata.editor) puzzleText += 'Edited by ' + metadata.editor + '<br>';
			if (puzzleText) infoText = puzzleText + infoText;
		}
		puzzleInfo.innerHTML = infoText;
	}

	window.updatePuzzleInfo = displayPuzzleInfo;

	function getTodayString() {
		const now = new Date();
		const yyyy = now.getFullYear();
		const mm = String(now.getMonth() + 1).padStart(2, '0');
		const dd = String(now.getDate()).padStart(2, '0');
		return `${yyyy}-${mm}-${dd}`;
	}

	(function setupDayChangeRefresh() {
		const lastDateKey = '3seals_last_date';
		let lastKnownDate = localStorage.getItem(lastDateKey) || getTodayString();
		document.addEventListener('visibilitychange', () => {
			if (!document.hidden) {
				const today = getTodayString();
				if (lastKnownDate !== today) {
					window.location.reload();
				}
			} else {
				lastKnownDate = getTodayString();
				localStorage.setItem(lastDateKey, lastKnownDate);
			}
		});
		function scheduleMidnightRefresh() {
			const now = new Date();
			const tomorrow = new Date(now.getFullYear(), now.getMonth(), now.getDate() + 1, 0, 0, 1);
			const msUntilMidnight = tomorrow - now;
			setTimeout(() => {
				const today = getTodayString();
				if (lastKnownDate !== today) {
					window.location.reload();
				} else {
					scheduleMidnightRefresh();
				}
			}, msUntilMidnight);
		}
		scheduleMidnightRefresh();
	})();

	if ('serviceWorker' in navigator) {
		navigator.serviceWorker.getRegistration().then((registration) => {
			if (registration) {
				registration.update().catch((err) => {
					console.log('Service worker update check failed:', err);
				});
			}
		});
	}

	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) return Promise.reject(new Error('Service worker already exists.'));
					return registration;
				}).then(() => engine.installServiceWorker()),
				new Promise((resolve) => setTimeout(() => resolve(), 2000)),
			]).then(() => {
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			statusProgress.style.display = 'none';
			playButton.style.display = 'block';
			gameReady = true;
			const puzzleInfo = document.getElementById('puzzle-info');
			if (puzzleInfo) {
				setTimeout(() => { puzzleInfo.style.opacity = '1'; }, 100);
			}
		}, displayFailureNotice);
	}
}());
		</script>
