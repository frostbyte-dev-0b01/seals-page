html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #333;
	background-color: white;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status {
	top: 0;
	bottom: 0;
}

#status {
	background-color: white;
	position: absolute;
	visibility: hidden;
	overflow: hidden;
	--brand-gap: clamp(12px, 2.2vh, 28px);
	--brand-offset-y: clamp(0px, 1.8vh, 20px);
	--splash-width: min(90vw, 620px);
	--splash-max-height: 26vh;
	--runes-width: min(52vw, 280px);
	--runes-max-height: 28vh;
	--runes-nudge-y: -8px;
	--status-bottom-reserved: clamp(120px, 18vh, 190px);
}

#status-brand {
	position: absolute;
	top: 0;
	left: 0;
	right: 0;
	bottom: var(--status-bottom-reserved);
	width: 100%;
	display: flex;
	flex-direction: column;
	align-items: center;
	justify-content: center;
	gap: var(--brand-gap);
	transform: translateY(var(--brand-offset-y));
	pointer-events: none;
	z-index: 1;
}

#status-splash {
	width: var(--splash-width);
	max-height: var(--splash-max-height);
	height: auto;
	margin: 0;
}

#status-splash.show-image--false {
	display: none;
}

#status-runes {
	width: var(--runes-width);
	max-height: var(--runes-max-height);
	height: auto;
	margin-top: var(--runes-nudge-y);
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-progress.indeterminate:indeterminate {
	animation: pulse 1.2s ease-in-out infinite;
}

@keyframes pulse {
	0%, 100% { opacity: 0.4; }
	50% { opacity: 1; }
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#status-bottom {
	position: absolute;
	left: 0;
	right: 0;
	bottom: 0;
	width: 100%;
	display: flex;
	flex-direction: column;
	align-items: center;
	padding-bottom: max(20px, env(safe-area-inset-bottom));
	gap: 1rem;
	z-index: 3;
}

#whats-new {
	position: fixed;
	top: 28px;
	left: 10px;
	width: auto;
	max-width: min(78vw, 320px);
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	color: #5b3943;
	opacity: 0;
	transform: translateY(4px);
	transition: opacity 0.3s ease, transform 0.3s ease;
	z-index: 1000;
}

#whats-new.is-visible {
	opacity: 1;
	transform: translateY(0);
}

#whats-new[hidden] {
	display: none;
}

#whats-new-toggle {
	width: auto;
	display: flex;
	align-items: center;
	justify-content: space-between;
	gap: 0.45rem;
	padding: 0.28rem 0.5rem 0.32rem;
	background: rgba(255, 255, 255, 0.82);
	border: 1px solid rgba(245, 168, 91, 0.18);
	border-radius: 0.55rem;
	box-shadow: 0 1px 2px rgba(91, 57, 67, 0.06);
	color: inherit;
	font: inherit;
	cursor: pointer;
	text-align: left;
}

#whats-new-toggle:hover {
	background: rgba(255, 255, 255, 0.94);
}

#whats-new-toggle:focus-visible {
	outline: 2px solid rgba(245, 168, 91, 0.65);
	outline-offset: 2px;
}

#whats-new-summary {
	display: flex;
	align-items: center;
	gap: 0.55rem;
	min-width: 0;
}

#whats-new[data-expanded="true"] {
	width: min(78vw, 320px);
}

#whats-new[data-expanded="true"] #whats-new-toggle {
	width: 100%;
}

#whats-new-dot {
	width: 0.5rem;
	height: 0.5rem;
	flex: 0 0 auto;
	border-radius: 999px;
	background: #f5a85b;
	box-shadow: 0 0 0 3px rgba(245, 168, 91, 0.16);
}

#whats-new-dot[hidden] {
	display: none;
}

#whats-new-title {
	font-size: 0.76rem;
	font-weight: 500;
	letter-spacing: 0.01em;
}

#whats-new-chevron {
	font-size: 0.72rem;
	color: #8e6671;
	transition: transform 0.2s ease;
}

#whats-new[data-expanded="true"] #whats-new-chevron {
	transform: rotate(180deg);
}

#whats-new-panel {
	margin-top: 0.45rem;
	padding: 0.75rem 0.8rem 0.8rem;
	background: rgba(255, 255, 255, 0.96);
	border: 1px solid rgba(245, 168, 91, 0.2);
	border-radius: 0.6rem;
	box-shadow: 0 6px 20px rgba(91, 57, 67, 0.08);
	font-size: 0.8rem;
	line-height: 1.5;
	color: #6a5058;
}

#whats-new-panel[hidden] {
	display: none;
}

#whats-new-version {
	margin: 0 0 0.45rem;
	font-size: 0.7rem;
	font-weight: 700;
	letter-spacing: 0.04em;
	text-transform: uppercase;
	color: #9a6f3d;
}

#whats-new-list {
	margin: 0;
	padding-left: 1.1rem;
}

#whats-new-list li + li {
	margin-top: 0.3rem;
}

#play-button {
	display: block;
	visibility: hidden;
	opacity: 0;
	pointer-events: none;
	padding: 1rem 2rem;
	font-size: 1.5rem;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	background-color: #4CAF50;
	color: white;
	border: none;
	border-radius: 0.5rem;
	cursor: pointer;
	transition: background-color 0.3s, opacity 0.2s ease;
}

#play-button:hover {
	background-color: #45a049;
}

#play-button:active {
	background-color: #3d8b40;
}

#puzzle-info {
	text-align: center;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.75rem;
	color: #666;
	line-height: 1.6;
	width: 100%;
	padding: 0 20px;
	box-sizing: border-box;
	opacity: 0;
	transition: opacity 0.5s ease-in;
}

#version-number {
	position: fixed;
	top: 8px;
	left: 10px;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.65rem;
	color: #999;
	z-index: 1000;
}

@media (max-width: 520px) {
	#whats-new {
		max-width: min(84vw, 280px);
	}

	#whats-new[data-expanded="true"] {
		width: min(84vw, 280px);
	}
}

/* --- Orientation Lock Styling --- */
#orientation-warning {
	display: none;
	position: fixed;
	top: 0;
	left: 0;
	width: 100%;
	height: 100%;
	background-color: white;
	color: #5b3943;
	z-index: 9999;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	text-align: center;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
}

#orientation-warning span {
	font-size: 4rem;
	margin-bottom: 1rem;
}

@media (min-width: 900px) {
	#status {
		--brand-gap: clamp(16px, 3.2vh, 36px);
		--brand-offset-y: clamp(0px, 1.5vh, 16px);
		--splash-width: min(64vw, 760px);
		--splash-max-height: 32vh;
		--runes-width: min(32vw, 320px);
		--runes-max-height: 30vh;
		--runes-nudge-y: -10px;
		--status-bottom-reserved: clamp(130px, 16vh, 200px);
	}
}

@media (max-height: 760px) {
	#status {
		--brand-gap: clamp(8px, 1.6vh, 16px);
		--brand-offset-y: clamp(8px, 3.2vh, 28px);
		--splash-width: min(88vw, 520px);
		--splash-max-height: 22vh;
		--runes-width: min(56vw, 250px);
		--runes-max-height: 22vh;
		--runes-nudge-y: -6px;
		--status-bottom-reserved: clamp(105px, 16vh, 160px);
	}
}

@media (orientation: portrait) and (max-aspect-ratio: 9/16) {
	#status {
		--brand-gap: clamp(6px, 1.1vh, 12px);
		--brand-offset-y: clamp(14px, 4.4vh, 34px);
		--splash-width: min(94vw, 560px);
		--splash-max-height: 22vh;
		--runes-width: min(58vw, 260px);
		--runes-max-height: 22vh;
		--runes-nudge-y: -5px;
		--status-bottom-reserved: clamp(100px, 15vh, 150px);
	}
}

/* Only show the warning if:
   1. The device is in landscape 
   2. AND the screen width is small (typical of a phone) */
@media (orientation: landscape) and (max-width: 950px) {
	#orientation-warning {
		display: flex;
	}
	#canvas, #status, #version-number {
		display: none !important;
	}
}

		<script>
function todayIsoDate() {
	const now = new Date();
	const yyyy = now.getFullYear();
	const mm = String(now.getMonth() + 1).padStart(2, '0');
	const dd = String(now.getDate()).padStart(2, '0');
	return `${yyyy}-${mm}-${dd}`;
}

// localStorage bridge for game save/load + user stats tracking
(function () {
	const SAVE_KEY = '3seals_save';
	const FIRST_VISIT_KEY = '3seals_has_visited';
	let guestSessionPromise = null;

	function isIsoDate(value) {
		return /^\d{4}-\d{2}-\d{2}$/.test(value);
	}

	function resolvePuzzleId(stateObj) {
		if (!stateObj || typeof stateObj !== 'object') return null;
		return String(stateObj.metadata_id || stateObj.puzzle_id || '').trim() || null;
	}

	function resolvePuzzleDate(stateObj) {
		const showDate = stateObj && typeof stateObj.show_date === 'string' ? stateObj.show_date.trim() : '';
		return isIsoDate(showDate) ? showDate : todayIsoDate();
	}

	function getWinGuessCount(stateObj) {
		if (
			stateObj &&
			typeof stateObj.winning_guess_count === 'number' &&
			stateObj.winning_guess_count >= 0
		) {
			return stateObj.winning_guess_count;
		}
		if (stateObj && Array.isArray(stateObj.all_guesses)) {
			return stateObj.all_guesses.length;
		}
		return 0;
	}

	function getTotalWordsFound(stateObj) {
		if (!stateObj || !stateObj.found_words) {
			if (stateObj && Array.isArray(stateObj.all_guesses)) {
				return stateObj.all_guesses.length;
			}
			return 0;
		}
		if (typeof stateObj.found_words === 'object') {
			const keyCount = Object.keys(stateObj.found_words).length;
			if (keyCount > 0) return keyCount;
		}
		if (Array.isArray(stateObj.all_guesses)) {
			return stateObj.all_guesses.length;
		}
		return 0;
	}

	function isCompletedState(stateObj) {
		return !!(stateObj && Array.isArray(stateObj.found_seals) && stateObj.found_seals.length >= 3);
	}

	window.ensureGuestSession = async function ensureGuestSession() {
		if (guestSessionPromise) {
			return guestSessionPromise;
		}
		guestSessionPromise = fetch('/.netlify/functions/session', {
			method: 'POST',
			credentials: 'include',
			cache: 'no-store',
			keepalive: true
		}).then((response) => {
			if (!response.ok) {
				throw new Error(`session init failed: ${response.status}`);
			}
			return response;
		}).catch((err) => {
			guestSessionPromise = null;
			throw err;
		});
		return guestSessionPromise;
	}

	async function upsertUserStats(payload) {
		await fetch('/.netlify/functions/stats-event', {
			method: 'POST',

			.catch((err) => {

			return true;
		} catch (e) {

			return false;
		}
	};

	window.loadPuzzleState = function () {
		try {

		} catch (e) {

			return null;
		}
	};

	window.clearPuzzleState = function () {
		try {
			localStorage.removeItem(SAVE_KEY);
			return true;
		} catch (e) {
			console.error('Failed to clear game state:', e);
			return false;
		}
	};

		try {
			if (localStorage.getItem(FIRST_VISIT_KEY) !== null) {
				return false;
			}
			localStorage.setItem(FIRST_VISIT_KEY, '1');
			return true;
		} catch (e) {
			console.warn('Failed to read/write first-visit flag:', e);
			return false;
		}
	};
