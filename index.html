<!DOCTYPE html>
<html lang="en">
	<head>
		<meta charset="utf-8">
		<meta name="viewport" content="width=device-width, user-scalable=no, initial-scale=1.0">
		<title>Runes</title>
		<style>
html, body, #canvas {
	margin: 0;
	padding: 0;
	border: 0;
}

body {
	color: #333;
	background-color: white;
	overflow: hidden;
	touch-action: none;
}

#canvas {
	display: block;
}

#canvas:focus {
	outline: none;
}

#status, #status-splash, #status-progress {
	position: absolute;
	left: 0;
	right: 0;
}

#status, #status-splash {
	top: 0;
	bottom: 0;
}

#status {
	background-color: white;
	display: flex;
	flex-direction: column;
	justify-content: center;
	align-items: center;
	visibility: hidden;
}

#status-splash {
	max-height: 100%;
	max-width: 100%;
	margin: auto;
}

#status-splash.show-image--false {
	display: none;
}

#status-splash.fullsize--true {
	height: 100%;
	width: 100%;
	object-fit: contain;
}

#status-splash.use-filter--false {
	image-rendering: pixelated;
}

#status-progress, #status-notice {
	display: none;
}

#status-progress {
	bottom: 10%;
	width: 50%;
	margin: 0 auto;
}

#status-notice {
	background-color: #5b3943;
	border-radius: 0.5rem;
	border: 1px solid #9b3943;
	color: #e0e0e0;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	line-height: 1.3;
	margin: 0 2rem;
	overflow: hidden;
	padding: 1rem;
	text-align: center;
	z-index: 1;
}

#play-button {
	display: none;
	position: absolute;
	bottom: 15%;
	left: 50%;
	transform: translateX(-50%);
	padding: 1rem 2rem;
	font-size: 1.5rem;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	background-color: #4CAF50;
	color: white;
	border: none;
	border-radius: 0.5rem;
	cursor: pointer;
	transition: background-color 0.3s;
	z-index: 2;
}

#play-button:hover {
	background-color: #45a049;
}

#play-button:active {
	background-color: #3d8b40;
}

#puzzle-info {
	position: absolute;
	bottom: 20px;
	left: 50%;
	transform: translateX(-50%);
	text-align: center;
	font-family: 'Noto Sans', 'Droid Sans', Arial, sans-serif;
	font-size: 0.75rem;
	color: #666;
	line-height: 1.6;
	z-index: 3;
	width: 100%;
	padding: 0 20px;
	box-sizing: border-box;
	opacity: 0;
	transition: opacity 0.5s ease-in;
}
		</style>
		<link id="-gd-engine-icon" rel="icon" type="image/png" href="index.icon.png" />
<link rel="apple-touch-icon" href="index.apple-touch-icon.png"/>
<link rel="manifest" href="index.manifest.json">

	</head>
	<body>
		<canvas id="canvas">
			Your browser does not support the canvas tag.
		</canvas>

		<noscript>
			Your browser does not support JavaScript.
		</noscript>

		<div id="status">
			<img id="status-splash" class="show-image--true fullsize--true use-filter--true" src="index.png" alt="">
			<progress id="status-progress"></progress>
			<div id="status-notice"></div>
			<button id="play-button">Play</button>
			<div id="puzzle-info">[show_date]<br>No. [id]<br>Edited by [editor]<br>Email: dailyrunesgame@gmail.com</div>
		</div>

		<script src="index.js"></script>
		<script>
// localStorage bridge for game save/load
window.savePuzzleState = function(stateObj) {
	try {
		// stateObj is passed as a JS object from GDScript; stringify for storage
		localStorage.setItem('3seals_save', JSON.stringify(stateObj));
		return true;
	} catch (e) {
		console.error('Failed to save game state:', e);
		return false;
	}
};

window.loadPuzzleState = function() {
	try {
		return localStorage.getItem('3seals_save');
	} catch (e) {
		console.error('Failed to load game state:', e);
		return null;
	}
};

window.clearPuzzleState = function() {
	try {
		localStorage.removeItem('3seals_save');
		return true;
	} catch (e) {
		console.error('Failed to clear game state:', e);
		return false;
	}
};
		</script>
		<script>
const GODOT_CONFIG = {"args":[],"canvasResizePolicy":2,"ensureCrossOriginIsolationHeaders":true,"executable":"index","experimentalVK":false,"fileSizes":{"index.pck":38130016,"index.wasm":52126319},"focusCanvas":true,"gdextensionLibs":[],"serviceWorker":"index.service.worker.js"};
const GODOT_THREADS_ENABLED = false;
const engine = new Engine(GODOT_CONFIG);

(function () {
	const statusOverlay = document.getElementById('status');
	const statusProgress = document.getElementById('status-progress');
	const statusNotice = document.getElementById('status-notice');
	const playButton = document.getElementById('play-button');

	let initializing = true;
	let statusMode = '';
	let gameReady = false;

	function setStatusMode(mode) {
		if (statusMode === mode || !initializing) {
			return;
		}
		if (mode === 'hidden') {
			statusOverlay.remove();
			initializing = false;
			return;
		}
		statusOverlay.style.visibility = 'visible';
		statusProgress.style.display = mode === 'progress' ? 'block' : 'none';
		statusNotice.style.display = mode === 'notice' ? 'block' : 'none';
		statusMode = mode;
	}

	function setStatusNotice(text) {
		while (statusNotice.lastChild) {
			statusNotice.removeChild(statusNotice.lastChild);
		}
		const lines = text.split('\n');
		lines.forEach((line) => {
			statusNotice.appendChild(document.createTextNode(line));
			statusNotice.appendChild(document.createElement('br'));
		});
	}

	function displayFailureNotice(err) {
		console.error(err);
		if (err instanceof Error) {
			setStatusNotice(err.message);
		} else if (typeof err === 'string') {
			setStatusNotice(err);
		} else {
			setStatusNotice('An unknown error occurred.');
		}
		setStatusMode('notice');
		initializing = false;
	}

	function startGame() {
		statusOverlay.remove();
		initializing = false;
	}

	playButton.addEventListener('click', startGame);

	// Function to display puzzle metadata
	function displayPuzzleInfo(metadata) {
		console.log('displayPuzzleInfo called with:', metadata);
		const puzzleInfo = document.getElementById('puzzle-info');
		if (!puzzleInfo) {
			console.error('puzzle-info element not found!');
			return;
		}
		// Always show email at minimum
		let infoText = 'Email: dailyrunesgame@gmail.com';
		
		if (metadata) {
			// Build info text with puzzle data
			let puzzleText = '';
			if (metadata.show_date) {
				puzzleText += metadata.show_date + '<br>';
			}
			if (metadata.id) {
				puzzleText += 'No. ' + metadata.id + '<br>';
			}
			if (metadata.editor) {
				puzzleText += 'Edited by ' + metadata.editor + '<br>';
			}
			// Prepend puzzle info before email
			if (puzzleText) {
				infoText = puzzleText + infoText;
			}
		}
		
		puzzleInfo.innerHTML = infoText;
		console.log('Puzzle info displayed:', infoText);
	}

	// Make function available globally for Godot to call
	window.updatePuzzleInfo = displayPuzzleInfo;
	console.log('window.updatePuzzleInfo function registered');

	function getTodayString() {
		const now = new Date();
		// Use local date to match in-game daily logic (local midnight)
		const yyyy = now.getFullYear();
		const mm = String(now.getMonth() + 1).padStart(2, '0');
		const dd = String(now.getDate()).padStart(2, '0');
		return `${yyyy}-${mm}-${dd}`;
	}

	function parseCsvLine(line) {
		// Proper CSV parsing that handles quoted fields with commas
		const result = [];
		let current = '';
		let inQuotes = false;
		
		for (let i = 0; i < line.length; i++) {
			const char = line[i];
			if (char === '"') {
				if (inQuotes && line[i + 1] === '"') {
					// Escaped quote
					current += '"';
					i++; // Skip next quote
				} else {
					// Toggle quote state
					inQuotes = !inQuotes;
				}
			} else if (char === ',' && !inQuotes) {
				// Field separator
				result.push(current.trim());
				current = '';
			} else {
				current += char;
			}
		}
		// Add last field
		result.push(current.trim());
		return result;
	}

	function parseCsv(text) {
		const lines = text.trim().split(/\r?\n/);
		if (lines.length === 0) return null;
		
		// Parse header
		const headers = parseCsvLine(lines[0]);
		const idx = {
			show_date: headers.indexOf('show_date'),
			id: headers.indexOf('id'),
			editor: headers.indexOf('editor'),
		};
		
		console.log('CSV headers:', headers);
		console.log('Column indices:', idx);
		
		const today = getTodayString();
		console.log('Looking for today:', today);
		
		for (let i = 1; i < lines.length; i++) {
			if (!lines[i].trim()) continue;
			const cols = parseCsvLine(lines[i]);
			const showDate = idx.show_date >= 0 ? cols[idx.show_date] : '';
			console.log(`Row ${i}: show_date="${showDate}", id="${idx.id >= 0 ? cols[idx.id] : ''}", editor="${idx.editor >= 0 ? cols[idx.editor] : ''}"`);
			
			if (showDate === today) {
				const result = {
					show_date: showDate,
					id: idx.id >= 0 ? cols[idx.id] : '',
					editor: idx.editor >= 0 ? cols[idx.editor] : '',
				};
				console.log('Found matching puzzle:', result);
				return result;
			}
		}
		console.log('No matching puzzle found for today');
		return null;
	}

	function loadPuzzleInfo() {
		console.log('loadPuzzleInfo: Attempting to load puzzle_master.csv');
		// Return the promise chain
		return fetch('puzzle_master.csv')
			.then(response => {
				console.log('loadPuzzleInfo: CSV fetch status:', response.status);
				if (!response.ok) throw new Error('CSV not found');
				return response.text();
			})
			.then(csvText => {
				const meta = parseCsv(csvText);
				if (meta) {
					console.log('loadPuzzleInfo: found today in CSV:', meta);
					displayPuzzleInfo(meta);
					return Promise.resolve();
				}
				console.warn('loadPuzzleInfo: no matching show_date in CSV, falling back to JSON');
				throw new Error('No matching show_date in CSV');
			})
			.catch(err => {
				console.log('loadPuzzleInfo: CSV load failed, trying puzzle_metadata.json:', err);
				return fetch('puzzle_metadata.json')
					.then(response => {
						console.log('loadPuzzleInfo: JSON fetch status:', response.status);
						if (!response.ok) throw new Error('Metadata file not found');
						return response.json();
					})
					.then(data => {
						console.log('loadPuzzleInfo: loaded data:', data);
						if (data.metadata) {
							displayPuzzleInfo(data.metadata);
						} else {
							console.warn('loadPuzzleInfo: data.metadata is missing');
						}
						return Promise.resolve();
					})
					.catch(err2 => {
						// If metadata file doesn't exist, will get it from Godot after game loads
						console.log('loadPuzzleInfo: puzzle_metadata.json not found; will rely on Godot callback if available:', err2);
						return Promise.resolve(); // Always resolve so fade-in happens
					});
			});
	}


	const missing = Engine.getMissingFeatures({
		threads: GODOT_THREADS_ENABLED,
	});

	if (missing.length !== 0) {
		if (GODOT_CONFIG['serviceWorker'] && GODOT_CONFIG['ensureCrossOriginIsolationHeaders'] && 'serviceWorker' in navigator) {
			let serviceWorkerRegistrationPromise;
			try {
				serviceWorkerRegistrationPromise = navigator.serviceWorker.getRegistration();
			} catch (err) {
				serviceWorkerRegistrationPromise = Promise.reject(new Error('Service worker registration failed.'));
			}
			// There's a chance that installing the service worker would fix the issue
			Promise.race([
				serviceWorkerRegistrationPromise.then((registration) => {
					if (registration != null) {
						return Promise.reject(new Error('Service worker already exists.'));
					}
					return registration;
				}).then(() => engine.installServiceWorker()),
				// For some reason, `getRegistration()` can stall
				new Promise((resolve) => {
					setTimeout(() => resolve(), 2000);
				}),
			]).then(() => {
				// Reload if there was no error.
				window.location.reload();
			}).catch((err) => {
				console.error('Error while registering service worker:', err);
			});
		} else {
			// Display the message as usual
			const missingMsg = 'Error\nThe following features required to run Godot projects on the Web are missing:\n';
			displayFailureNotice(missingMsg + missing.join('\n'));
		}
	} else {
		setStatusMode('progress');
		engine.startGame({
			'onProgress': function (current, total) {
				if (current > 0 && total > 0) {
					statusProgress.value = current;
					statusProgress.max = total;
				} else {
					statusProgress.removeAttribute('value');
					statusProgress.removeAttribute('max');
				}
			},
		}).then(() => {
			// Show play button instead of hiding immediately
			statusProgress.style.display = 'none';
			playButton.style.display = 'block';
			gameReady = true;
			
			// Load puzzle info and fade it in
			loadPuzzleInfo().then(() => {
				// Fade in puzzle info after loading
				const puzzleInfo = document.getElementById('puzzle-info');
				if (puzzleInfo) {
					setTimeout(() => {
						puzzleInfo.style.opacity = '1';
					}, 100);
				}
			}).catch(() => {
				// Even if loading fails, fade in the static text
				const puzzleInfo = document.getElementById('puzzle-info');
				if (puzzleInfo) {
					setTimeout(() => {
						puzzleInfo.style.opacity = '1';
					}, 100);
				}
			});
		}, displayFailureNotice);
	}
}());
		</script>
	</body>
</html>
